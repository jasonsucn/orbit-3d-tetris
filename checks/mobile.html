<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>ORBIT · 手机布局验收</title><style>body{background:#050b11;color:#93d4bc;margin:0;font:12px Consolas,monospace;display:flex;gap:30px;padding:18px}iframe{width:390px;height:844px;border:1px solid #35594b;border-radius:14px;flex-shrink:0}aside{max-width:480px;line-height:1.9}button{padding:10px 14px;background:#d4fa88;border:0;color:#132719;border-radius:5px;cursor:pointer;margin:5px 0}pre{white-space:pre-wrap}</style><iframe id="app" src="../index.html" title="390px 手机游戏"></iframe><aside><h2>390 × 844 / MOBILE QA</h2><button id="check">验证布局与触屏按钮</button><pre id="report">待机预览</pre><button id="reset">返回待机预览</button></aside><script>
const f=document.querySelector('#app'),report=document.querySelector('#report');const wait=ms=>new Promise(r=>setTimeout(r,ms));function check(ok,name){report.textContent+='\n'+(ok?'PASS ':'FAIL ')+name;if(!ok)throw Error(name)}
document.querySelector('#check').onclick=async()=>{report.textContent='Running…';try{const w=f.contentWindow,d=w.document,a=w.OrbitApp;w.Element.prototype.setPointerCapture=()=>{};check(d.documentElement.scrollWidth<=390,'no horizontal overflow');const control=d.querySelector('.touch-controls').getBoundingClientRect(),stage=d.querySelector('#stage').getBoundingClientRect();check(control.height>40&&control.bottom<=844,'touch controls fit viewport');check(stage.height>320,'playfield has usable height');a.start();await wait(50);const e=a.engine,x=e.current.x,b=d.querySelector('[data-action="left"]');b.dispatchEvent(new w.PointerEvent('pointerdown',{pointerId:123,pointerType:'touch',bubbles:true,cancelable:true}));b.dispatchEvent(new w.PointerEvent('pointerup',{pointerId:123,pointerType:'touch',bubbles:true}));check(e.current.x===x-1,'touch move');const r=e.current.rotation,rot=d.querySelector('[data-action="rotate"]');rot.dispatchEvent(new w.PointerEvent('pointerdown',{pointerId:124,pointerType:'touch',bubbles:true,cancelable:true}));rot.dispatchEvent(new w.PointerEvent('pointerup',{pointerId:124,pointerType:'touch',bubbles:true}));check(e.current.rotation===(r+1)%4,'touch rotate');a.action('drop');check(e.pieces===1,'mobile hard drop');report.textContent+='\nMobile checks complete.'}catch(e){report.textContent+='\n'+e.message}};document.querySelector('#reset').onclick=()=>f.src='../index.html';
</script></html>
