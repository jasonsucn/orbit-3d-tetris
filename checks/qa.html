<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>ORBIT · 浏览器验收</title><style>body{margin:0;background:#080f18;color:#acdbc9;font:13px Consolas,monospace}header{padding:15px 25px;display:flex;gap:20px;align-items:center}button{padding:10px 15px;background:#d4fa88;border:0;border-radius:4px;color:#123126;cursor:pointer}iframe{width:1160px;height:820px;border:1px solid #29453e;display:block;margin:0 24px}pre{white-space:pre-wrap;padding:10px 25px;line-height:1.8}a{color:#91f7d5}</style><header><b>ORBIT / REAL BROWSER QA</b><button id="run">运行完整浏览器验收</button><a href="../index.html">打开最终成品</a></header><pre id="report">等待开始。使用真实成品运行规则与界面集成测试。</pre><iframe id="app" src="../index.html" title="游戏验收画面"></iframe><script>
const frame=document.querySelector('#app'),report=document.querySelector('#report');let tests=0;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function check(ok,label){if(!ok)throw Error(label);tests++;report.textContent+='\nPASS '+label}
function key(w,code){w.dispatchEvent(new w.KeyboardEvent('keydown',{code,bubbles:true}));w.dispatchEvent(new w.KeyboardEvent('keyup',{code,bubbles:true}))}
function fixture(e){e.board=Array.from({length:20},()=>Array(10).fill(null));for(let y=16;y<20;y++)for(let x=0;x<10;x++)if(x!==5)e.board[y][x]='J';e.current={type:'I',x:3,y:14,rotation:1};e._lastRotate=false;e._lockTime=0;e._fall=0}
document.querySelector('#run').onclick=async()=>{const run=document.querySelector('#run');run.disabled=true;report.textContent='Running…';tests=0;try{const w=frame.contentWindow,d=w.document,a=w.OrbitApp;check(!!a?.renderer&&!a.renderer.failed,'WebGL renderer initialized');check(a.renderer.gl.getError()===0,'WebGL draw loop has no graphics errors');a.start();await wait(60);let e=a.engine;check(e.state==='playing','start enters playing and hides ready overlay');check(d.querySelector('#ready-note').classList.contains('hidden'),'start overlay is hidden');const x=e.current.x;key(w,'ArrowLeft');check(e.current.x===x-1,'keyboard move');const rot=e.current.rotation;key(w,'KeyX');check(e.current.rotation===(rot+1)%4,'keyboard rotate');const first=e.current.type;key(w,'KeyC');check(e.held===first&&!e.canHold,'keyboard hold locks exchange');const heldType=e.current.type;key(w,'KeyC');check(e.current.type===heldType,'second hold rejected');key(w,'Space');check(e.pieces===1&&e.score>0,'hard drop locks and scores');key(w,'KeyP');check(e.state==='paused'&&a.state.modal==='pause-modal','P opens pause dialog');const pausedTime=e.elapsed;await wait(100);check(e.elapsed===pausedTime,'pause freezes clock');key(w,'KeyP');check(e.state==='playing'&&!a.state.modal,'P resumes from pause dialog');check(d.activeElement===d.querySelector('#game'),'resume restores keyboard focus');d.querySelector('#settings-btn').click();check(e.state==='paused'&&a.state.modal==='settings-modal','settings safely pause gameplay');d.querySelector('#volume').focus();key(w,'Escape');check(e.state==='playing'&&!a.state.modal,'Escape on volume slider closes settings and resumes');
fixture(e);key(w,'Space');await wait(60);check(e.lines===4,'real four-line clear');check(e.board.every(r=>r.every(v=>!v)),'rows collapse and perfect clear');check(d.querySelector('#lines').textContent==='04','HUD follows cleared rows');check(d.querySelector('#fx-message').classList.contains('show'),'clear effect is triggered');check(a.renderer.gl.getError()===0,'particle and clear rendering have no WebGL errors');
a.setMode('sprint40');a.start();e=a.engine;e.update(25);e.lines=36;fixture(e);key(w,'Space');check(e.state==='complete'&&e.lines===40,'sprint completes exactly at goal');await wait(480);check(a.state.modal==='result-modal','sprint result dialog is shown');check(d.querySelector('#result-lines').textContent==='40','sprint result contains 40 lines');check(!!JSON.parse(w.localStorage.getItem('orbit.records.v1')).sprint40,'sprint record persisted');d.querySelector('#again-btn').click();check(e.state==='playing'&&e.score===0&&e.lines===0,'replay fully resets run');check(!d.querySelector('#combo').classList.contains('active'),'replay clears combo overlay');
e.score=999;e.board[0].fill('Z');e._spawn('O');check(e.state==='over','spawn collision ends run');await wait(480);check(a.state.modal==='result-modal','gameover opens result dialog');d.querySelector('#result-home-btn').click();check(a.engine.state==='ready'&&!a.state.modal,'result returns to ready');
a.setMode('marathon');a.start();e=a.engine;e.score=4321;e.board[0].fill('Z');e._spawn('O');a.start();check(JSON.parse(w.localStorage.getItem('orbit.records.v1')).marathon>=4321,'instant restart retains finished record');await wait(500);check(a.state.modal==='','old result timer cannot interrupt new run');
const gl=a.renderer.gl,ext=gl.getExtension('WEBGL_lose_context');if(ext){ext.loseContext();await wait(120);check(a.renderer.failed&&a.engine.state==='paused','context loss pauses game');check(d.querySelector('#error-note').style.display==='block','context loss explains recovery');a.start();check(a.engine.state==='paused','context loss blocks invisible restart');ext.restoreContext()}
report.textContent+='\n\n'+tests+' / '+tests+' browser checks passed.';
}catch(error){report.textContent+='\nFAIL '+error.stack}finally{frame.contentWindow.localStorage.removeItem('orbit.records.v1');run.disabled=false}};
</script></html>
